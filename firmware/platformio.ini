; AI 스마트 안경형 보청기 — ESP32-S3 펌웨어
; 플랫폼: pioarduino 55.03.311 (Arduino-ESP32 3.3.11 + ESP-IDF 5.5.5) — 태그 고정 (CLAUDE.md §3)
; 공식 espressif32 플랫폼은 Arduino 2.x 동결이므로 사용 금지

[platformio]
default_envs = wifi

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
; N16R8: 16MB quad flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall
lib_deps =
    olikraus/U8g2@^2.35.4

[env:wifi]
build_flags = ${env.build_flags} -DTRANSPORT_WIFI

[env:ble]
build_flags = ${env.build_flags} -DTRANSPORT_BLE
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@2.5.0
