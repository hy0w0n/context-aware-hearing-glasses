# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE UI will override
# any settings written in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting max memory size allows building large projects faster.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX refactoring enabled by default with Android Studio 3.2 and higher
android.useAndroidX=true

# Enables non-transitive R classes to decrease app module size and speed up build.
# android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

# TensorFlow Lite Namespace Conflict Bypass
android.overridePathCheck=true
android.disableFinalPackageNamespaceCheck=true
android.enforceUniquePackageName=false
android.uniquePackageNames=false